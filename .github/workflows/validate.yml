name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip python-pptx
      - name: Skill frontmatter check
        run: |
          python - <<'PY'
          import re, pathlib
          t = pathlib.Path("skills/ppt-report-style/SKILL.md").read_text(encoding="utf-8")
          m = re.match(r"---\n(.*?)\n---\n", t, re.S)
          assert m, "缺少 frontmatter"
          fm = m.group(1)
          name = re.search(r"^name:\s*(.+)$", fm, re.M).group(1).strip().strip('"\'')
          desc = re.search(r"^description:\s*(.+)$", fm, re.M).group(1).strip()
          assert name == "ppt-report-style", name
          assert 20 <= len(desc) <= 1024, len(desc)
          print("frontmatter OK:", name, "| description", len(desc), "字符")
          PY
      - name: Style check on example deck
        run: python skills/ppt-report-style/scripts/verify_ppt_style.py skills/ppt-report-style/assets/example-slide.pptx
      - name: Structural audit on example deck
        run: python skills/ppt-report-style/scripts/audit_ppt.py skills/ppt-report-style/assets/example-slide.pptx
      - name: Example deck regenerates with identical content
        run: |
          git show HEAD:skills/ppt-report-style/assets/example-slide.pptx > /tmp/before.pptx
          python skills/ppt-report-style/scripts/build_example.py
          python - <<'PY'
          import zipfile
          def parts(p, pref=("ppt/slides/", "ppt/charts/", "ppt/theme/")):
              z = zipfile.ZipFile(p)
              return {n: z.read(n) for n in z.namelist() if n.startswith(pref)}
          a = parts("/tmp/before.pptx")
          b = parts("skills/ppt-report-style/assets/example-slide.pptx")
          assert set(a) == set(b), set(a) ^ set(b)
          diff = [k for k in a if a[k] != b[k]]
          assert not diff, f"示例页内容不一致: {diff}"
          print("示例页语义一致 ✓")
          PY
          python skills/ppt-report-style/scripts/verify_ppt_style.py skills/ppt-report-style/assets/example-slide.pptx
